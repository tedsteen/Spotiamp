name: build

on:
  # Pushing a `v*` tag builds, signs and publishes a release.
  push:
    tags:
      - "v*"
  # Build signed artifacts on demand (downloadable from the run), no release.
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # A newer manual build of the same branch supersedes an older one; release
  # builds are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write

jobs:
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        uses: softprops/action-gh-release@v3
        with:
          name: Spotiamp ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  bundle:
    needs: create-release
    # Runs after create-release on a tag push, or on its own for a manual build
    # (where create-release is skipped).
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # One universal app that runs natively on both Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos-universal
          - platform: windows-latest
            args: ""
            rust-targets: ""
            artifact: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Caches compiled dependencies. A run can only restore caches from its own
      # branch/tag or the default branch, so this mostly speeds up repeated
      # manual builds of the same branch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}

      - run: npm ci

      # Prebuilt, pinned and checksum-verified, instead of `cargo install` (which
      # compiled it for ~4.5 min on every run).
      - name: Install artifact-signing-cli
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing-cli"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "artifact-signing-cli.exe"
          Invoke-WebRequest "https://github.com/Levminer/trusted-signing-cli/releases/download/0.12.0/artifact-signing-cli.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne "DD6FA95A0367CBD32EA520037C3DF72D1ED8F523A5B07883B0C2A4034E918A53") { throw "artifact-signing-cli checksum mismatch: $hash" }
          Add-Content $env:GITHUB_PATH $dir

      # Signing: on macOS the Tauri CLI imports APPLE_CERTIFICATE into a temporary
      # keychain itself and checks it matches bundle.macOS.signingIdentity, then
      # notarizes with the APPLE_ID credentials. On Windows it runs the
      # bundle.windows.signCommand (artifact-signing-cli, using the AZURE_* creds).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          # Set on a tag push (uploads to that release), empty on manual builds.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Manual builds have no release, so expose the bundles as run artifacts.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: spotiamp-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error

  publish-release:
    needs: [create-release, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" -F draft=false
