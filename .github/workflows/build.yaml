name: build

on:
  # Pushing a `v*` tag builds, signs and publishes a release.
  push:
    tags:
      - "v*"
  # Signed installers to download and test, without a release.
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # A newer build of the same PR/branch supersedes an older one; release builds
  # are never cancelled.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}"
          --draft --verify-tag --generate-notes --title "Spotiamp ${{ github.ref_name }}"

  bundle:
    needs: create-release
    # Runs after create-release on a tag push, or on its own otherwise (where
    # create-release is skipped). PRs from forks can't use the signing secrets,
    # so they only get the check workflow.
    if: >-
      !cancelled() && needs.create-release.result != 'failure' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # One universal app that runs natively on both Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos-universal
          - platform: windows-latest
            args: ""
            rust-targets: ""
            artifact: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Caches compiled dependencies. A run can only restore caches from its own
      # branch/PR/tag or the default branch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.artifact }}

      - run: npm ci

      # Prebuilt, pinned and checksum-verified, instead of `cargo install` (which
      # compiled it for ~4.5 min on every run).
      - name: Install artifact-signing-cli
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing-cli"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "artifact-signing-cli.exe"
          Invoke-WebRequest "https://github.com/Levminer/trusted-signing-cli/releases/download/0.12.0/artifact-signing-cli.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne "DD6FA95A0367CBD32EA520037C3DF72D1ED8F523A5B07883B0C2A4034E918A53") { throw "artifact-signing-cli checksum mismatch: $hash" }
          Add-Content $env:GITHUB_PATH $dir

      # Signing: on macOS the Tauri CLI imports APPLE_CERTIFICATE into a temporary
      # keychain itself and checks it matches bundle.macOS.signingIdentity, then
      # notarizes with the APPLE_ID credentials. On Windows it runs the
      # bundle.windows.signCommand (artifact-signing-cli, using the AZURE_* creds).
      - name: Build and sign
        run: npm run tauri -- build ${{ matrix.args }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # Only the installers, flat: the .dmg on macOS, the setup .exe and .msi on
      # Windows.
      - name: Collect installers
        shell: bash
        run: |
          mkdir dist
          find src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} dist/ \;
          ls -l dist

      # Uploaded unzipped (one artifact per installer, named after the file).
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-setup.exe
          archive: false
          if-no-files-found: error
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.msi
          archive: false
          if-no-files-found: error

      - name: Attach installers to the draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: [create-release, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the drafted release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
