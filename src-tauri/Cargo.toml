[package]
name = "spotiamp"
version = "0.5.2"
description = "Spotify in Winamp Classic"
authors = ["Ted Steen"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spotiamp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"

thiserror = "2"
log = "0.4"
env_logger = "0.11"
librespot = { version = "0.8", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
audioviz = { version = "0.6", default-features = false, features = ["spectrum"] }

oauth2 = "5.0"
rustls = "0.23"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
tokio = { version = "1.54", default-features = false, features = ["net", "sync", "time"] }
directories = "6.0"
tauri-plugin-dialog = "2.8"
protobuf = "3.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSGraphics", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
# Thin LTO with the default codegen units: about half the build time of fat LTO
# with codegen-units = 1, for a ~24% bigger binary.
lto = "thin"

# NOTE: This causes a crash at startup around audio. Not sure why
# opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.

panic = "abort" # Higher performance by disabling panic handlers.
strip = true    # Ensures debug symbols are removed.
